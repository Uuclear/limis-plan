[project]
name = "matis-lims"
version = "1.0.0"
description = "建设材料检测实验室信息管理系统 (MatLIMS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy[asyncio]==2.0.39",
    "alembic==1.15.1",
    "greenlet==3.1.1",
    "asyncpg==0.30.0",
    "python-json-logger==2.0.7",
    "pydantic==2.10.6",
    "pydantic-settings==2.8.1",
    "pydantic[email]==2.10.6",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "starlette-sessions==0.0.2",
    "starlette-csrf==0.0.1",
    "bcrypt==4.3.0",
    "argon2-cffi==23.1.0",
    "redis==5.2.1",
    "weasyprint==64.1",
    "celery==5.4.0",
    "babel==2.17.0",
    "python-barcode==0.15.1",
    "qrcode[pil]==8.0",
    "pillow==11.2.1",
    "paddleocr==2.8.1",
    "opencv-python==4.11.0.86",
    "pyzbar==0.1.9",
    "serial==0.0.97",
    "pyserial==3.5",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.2",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.1.1",
    "httpx==0.28.1",
    "factory-boy==3.3.3",
    "playwright==1.50.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
